spring:
  application:
    name: api-gateway
  
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      httpclient:
        connect-timeout: 5000
        response-timeout: 10s

server:
  port: 8080

# Désactiver Eureka pour les tests
eureka:
  client:
    enabled: false

# Logging minimal pour les tests
logging:
  level:
    org.springframework: WARN
    com.iadaf.gateway: INFO

# Clé de test uniquement (32 octets minimum).
iadaf:
  security:
    internal-jwt-secret: test-secret-at-least-32-bytes-long-0123456789
