spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          # Routes explicites uniquement (GatewayConfig.java). Le « locator »
          # créait une route par service enregistré dans Eureka, Eureka compris
          # (/discovery-service/**) : de la surface sans usage.
          discovery:
            locator:
              enabled: false
          httpclient:
            connect-timeout: 5000
            response-timeout: 30s
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

server:
  port: 8080

# Clé des jetons internes signés par le frontend (HS256, 32 octets minimum).
# La gateway refuse de démarrer sans elle.
iadaf:
  security:
    internal-jwt-secret: ${INTERNAL_JWT_SECRET:}

# Configuration Eureka Client
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE-URL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    metadata-map:
      management.context-path: /actuator

# Circuit Breaker Configuration
resilience4j:
  circuitbreaker:
    instances:
      userServiceCircuitBreaker:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      demarchesServiceCircuitBreaker:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000
      documentServiceCircuitBreaker:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000
      aiServiceCircuitBreaker:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000
      analyticsServiceCircuitBreaker:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000

# Actuator — santé seulement, et sans détail : /actuator/health répond sans
# jeton (healthchecks). L'endpoint « gateway » a été retiré : il listait les
# routes et permettait d'en créer à quiconque détenait un jeton.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.iadaf.gateway: INFO

---
# Profil PRODUCTION
spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.iadaf.gateway: INFO

# Production Actuator - exposer uniquement les endpoints essentiels
management:
  endpoints:
    web:
      exposure:
        include: health,info

resilience4j:
  circuitbreaker:
    instances:
      userServiceCircuitBreaker:
        sliding-window-size: 20
        failure-rate-threshold: 60
