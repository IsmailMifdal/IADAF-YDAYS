spring:
  application:
    name: document-service
  datasource:
    url: jdbc:postgresql://localhost:5432/iadaf_db?currentSchema=documents
    username: ${POSTGRES_USER:iadaf_user}
    password: ${POSTGRES_PASSWORD:iadaf_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Le schéma appartient aux migrations Flyway.
      ddl-auto: validate
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        # dialect supprimé - auto-détection par Hibernate
        format_sql: true
        default_schema: documents

  flyway:
    schemas: documents
    default-schema: documents
    # Created by docker/postgres/provision.sql; fail fast if it is missing.
    create-schemas: false
  servlet:
    multipart:
      # 10 Mo par pièce, plus la marge des autres champs du formulaire.
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.security: INFO

# Clé des jetons internes signés par le frontend (HS256, 32 octets minimum).
# Le service refuse de démarrer sans elle.
iadaf:
  security:
    internal-jwt-secret: ${INTERNAL_JWT_SECRET:}
  documents:
    # Clé AES-256 (32 octets en base64) qui chiffre chaque fichier avant son
    # écriture en base. Le service refuse de démarrer sans elle.
    #   openssl rand -base64 32
    encryption-key: ${DOCUMENT_ENCRYPTION_KEY:}
    # Pièces effacées automatiquement au-delà de cette durée (RGPD).
    retention-days: ${DOCUMENT_RETENTION_DAYS:180}
