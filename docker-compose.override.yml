# IA-DAF — développement uniquement.
#
# Docker Compose charge ce fichier automatiquement avec `docker compose up`.
# Il publie les ports internes sur la loopback (127.0.0.1) pour déboguer :
# psql, dashboard Eureka, Swagger de l'AI Service, appels directs aux services.
# Il ajoute Mailpit, qui capture les e-mails de développement.
#
# Ne JAMAIS l'utiliser en production : lancer explicitement
#   docker compose -f docker-compose.yml up -d --build
# pour que seul le frontend soit publié.
#
# Les appels directs exigent quand même un jeton interne (voir SECURITY.md) :
# seuls /actuator/health et /ai/health répondent sans jeton.

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  discovery-service:
    ports:
      - "127.0.0.1:8761:8761"

  api-gateway:
    ports:
      - "127.0.0.1:8080:8080"

  ai-service:
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      # Pré-vérification des pièces active en développement (désactivée par
      # défaut en production, voir docker-compose.yml).
      - DOCUMENT_ANALYSIS_ENABLED=true

  user-service:
    ports:
      - "127.0.0.1:8081:8081"

  demarches-service:
    ports:
      - "127.0.0.1:8082:8082"

  document-service:
    ports:
      - "127.0.0.1:8083:8083"

  analytics-service:
    ports:
      - "127.0.0.1:8085:8085"

  # Faux serveur SMTP : capture les e-mails envoyés (réinitialisation du mot de
  # passe) et les affiche sur http://127.0.0.1:8025. Rien ne part vers
  # l'extérieur, quelle que soit l'adresse du destinataire.
  mailpit:
    image: axllent/mailpit:v1.31.3
    container_name: iadaf-mailpit
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - iadaf-network
    restart: unless-stopped

  frontend:
    environment:
      - SMTP_URL=smtp://mailpit:1025
      - MAIL_FROM=IA-DAF (dev) <no-reply@iadaf.local>
