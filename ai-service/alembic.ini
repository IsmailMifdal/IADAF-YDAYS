# Alembic — only needed to run migrations by hand. The service applies them
# itself at startup. The database URL comes from DATABASE_URL (see .env).
#
#   alembic -c alembic.ini upgrade head
#   alembic -c alembic.ini revision -m "describe the change"

[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
