spring:
  application:
    name: analytics-service
  datasource:
    url: jdbc:postgresql://localhost:5432/iadaf_db?currentSchema=analytics
    username: ${POSTGRES_USER:iadaf_user}
    password: ${POSTGRES_PASSWORD:iadaf_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Pas d'entité JPA : le schéma appartient aux migrations Flyway.
      ddl-auto: none
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        # dialect supprimé - auto-détection par Hibernate
        format_sql: true
        default_schema: analytics
  flyway:
    schemas: analytics
    default-schema: analytics
    # Created by docker/postgres/provision.sql; fail fast if it is missing.
    create-schemas: false

server:
  port: 8085

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.security: INFO

# Clé des jetons internes signés par le frontend (HS256, 32 octets minimum).
# Le service refuse de démarrer sans elle.
iadaf:
  security:
    internal-jwt-secret: ${INTERNAL_JWT_SECRET:}
