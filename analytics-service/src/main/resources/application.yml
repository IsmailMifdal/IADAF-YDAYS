spring:
  application:
    name: analytics-service
  datasource:
    url: jdbc:postgresql://localhost:5432/iadaf_db?currentSchema=analytics
    username: ${POSTGRES_USER:iadaf_user}
    password: ${POSTGRES_PASSWORD:iadaf_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        # dialect supprimé - auto-détection par Hibernate
        format_sql: true
        default_schema: analytics
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/iadaf}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/iadaf/protocol/openid-connect/certs}
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=300s
    cache-names:
      - demarcheStats
      - documentStats
      - userActivity
      - dashboard
      - performance

server:
  port: 8085

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.security: DEBUG

# Service URLs for inter-service communication
services:
  user-service:
    url: ${USER_SERVICE_URL:http://localhost:8082}
  demarches-service:
    url: ${DEMARCHES_SERVICE_URL:http://localhost:8083}
  document-service:
    url: ${DOCUMENT_SERVICE_URL:http://localhost:8084}
