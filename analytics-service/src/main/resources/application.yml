spring:
  application:
    name: analytics-service
  datasource:
    url: jdbc:postgresql://localhost:5432/iadaf_db?currentSchema=analytics
    username: ${POSTGRES_USER:iadaf_user}
    password: ${POSTGRES_PASSWORD:iadaf_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        # dialect supprimé - auto-détection par Hibernate
        format_sql: true
        default_schema: analytics
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=300s
    cache-names:
      - demarcheStats
      - documentStats
      - userActivity
      - dashboard
      - performance

server:
  port: 8085

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.security: INFO

# Service URLs for inter-service communication
# Ports alignés sur ceux réellement exposés par chaque service :
# user 8081, demarches 8082, document 8083 (ils étaient tous décalés d'un cran).
services:
  user-service:
    url: ${USER_SERVICE_URL:http://localhost:8081}
  demarches-service:
    url: ${DEMARCHES_SERVICE_URL:http://localhost:8082}
  document-service:
    url: ${DOCUMENT_SERVICE_URL:http://localhost:8083}
