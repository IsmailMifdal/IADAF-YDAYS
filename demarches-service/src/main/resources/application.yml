spring:
  application:
    name: demarches-service
  datasource:
    url: jdbc:postgresql://localhost:5432/iadaf_db?currentSchema=demarches
    username: ${POSTGRES_USER:iadaf_user}
    password: ${POSTGRES_PASSWORD:iadaf_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Le schéma appartient aux migrations Flyway : Hibernate se contente de
      # vérifier qu'il correspond aux entités, et refuse de démarrer sinon.
      ddl-auto: validate
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        # dialect supprimé - auto-détection par Hibernate
        format_sql: true
        default_schema: demarches

  flyway:
    schemas: demarches
    default-schema: demarches
    # Created by docker/postgres/provision.sql; fail fast if it is missing.
    create-schemas: false
    # Bases créées avant Flyway (par Hibernate, ddl-auto=update) : leur schéma
    # correspond à V1, qui est donc marquée appliquée sans être rejouée.
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.security: INFO

# Clé des jetons internes signés par le frontend (HS256, 32 octets minimum).
# Le service refuse de démarrer sans elle.
iadaf:
  security:
    internal-jwt-secret: ${INTERNAL_JWT_SECRET:}
