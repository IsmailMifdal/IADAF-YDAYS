spring:
  application:
    name: demarches-service
  datasource:
    url: jdbc:postgresql://localhost:5432/iadaf_db?currentSchema=demarches
    username: ${POSTGRES_USER:iadaf_user}
    password: ${POSTGRES_PASSWORD:iadaf_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        # dialect supprimé - auto-détection par Hibernate
        format_sql: true
        default_schema: demarches

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.security: INFO

# Clé des jetons internes signés par le frontend (HS256, 32 octets minimum).
# Le service refuse de démarrer sans elle.
iadaf:
  security:
    internal-jwt-secret: ${INTERNAL_JWT_SECRET:}
