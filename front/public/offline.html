<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hors ligne — IA-DAF</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f1f5f9;
        color: #1e293b;
      }
      main {
        max-width: 28rem;
        margin: 1rem;
        padding: 2rem;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 1rem;
        text-align: center;
      }
      .mark {
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 auto 1rem;
        border-radius: 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #2563eb, #4338ca);
        color: #fff;
        font-weight: 700;
        font-size: 1.25rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0.25rem 0;
        color: #475569;
        line-height: 1.5;
      }
      .other {
        margin-top: 1rem;
        font-size: 0.875rem;
      }
      button {
        margin-top: 1.5rem;
        padding: 0.625rem 1.25rem;
        border: 0;
        border-radius: 0.75rem;
        background: #2563eb;
        color: #fff;
        font-size: 0.9375rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">IA</div>
      <h1>Vous êtes hors ligne</h1>
      <p>IA-DAF a besoin d'une connexion Internet. Vos dossiers et vos pièces ne sont jamais enregistrés sur cet appareil.</p>
      <div class="other">
        <p lang="en">You are offline — IA-DAF needs an Internet connection.</p>
        <p lang="es">Estás sin conexión: IA-DAF necesita Internet.</p>
        <p lang="ar" dir="rtl">أنت غير متصل بالإنترنت — يحتاج IA-DAF إلى اتصال.</p>
      </div>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
