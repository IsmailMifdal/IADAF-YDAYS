# IADAF v2 — chat QLoRA sur RTX 5080 Laptop 16 Go
# Famille : Qwen3 (plus Qwen2.5). Un seul gros poids GPU à la fois.
base_model: Qwen/Qwen3-8B
output_name: iadaf-qwen3-8b
version: v2

max_seq_length: 2048
load_in_4bit: true
gradient_checkpointing: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  epochs: 2
  # batch 1–2 + accum pour tenir en 10–14 Go VRAM
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 2.0e-4
  warmup_ratio: 0.03
  weight_decay: 0.01
  logging_steps: 10
  save_steps: 200
  seed: 42
  bf16: true
  optim: adamw_8bit

export:
  gguf_quant: Q4_K_M
  chat_template: qwen
