# Deployment, as decided in #70 (option B):
# - staging: every push to main whose CI is green (its images are on GHCR);
# - prod: a version tag vX.Y.Z on a commit of main, after the project owner
#   approves the run (GitHub environment "prod"); the images get the version tag
#   and the release notes are published.
# A manual run (Actions → Deploy → Run workflow) redeploys or rolls back: pick
# the ref (a tag for prod) and the environment.
#
# Each GitHub environment points at its own server:
#   vars    DEPLOY_HOST, DEPLOY_USER (default deploy), DEPLOY_PATH (default
#           /opt/iadaf), DOMAIN
#   secrets DEPLOY_SSH_KEY (private key allowed for DEPLOY_USER),
#           DEPLOY_KNOWN_HOSTS (output of ssh-keyscan for DEPLOY_HOST)
# While DEPLOY_HOST is empty the job only says so: nothing fails before the
# servers exist. Setup: DEPLOYMENT.md § 8.
#
# Third-party actions are pinned to the commit of a release (tag in comment).
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy the chosen ref to (prod accepts tags only)
        type: choice
        options: [staging, prod]

permissions:
  contents: read

jobs:
  staging:
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push')
      || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://${{ vars.DOMAIN }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/iadaf' }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::notice::staging is not configured yet (DEPLOY_HOST is empty): nothing deployed. See DEPLOYMENT.md § 8."
            exit 0
          fi
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::unexpected commit SHA: $SHA"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && git fetch --quiet --tags origin && git -c advice.detachedHead=false checkout --quiet $SHA && deploy/deploy.sh"

  prod:
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      && (github.event_name == 'push'
        || (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'))
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: https://${{ vars.DOMAIN }}
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: write   # release notes
      packages: write   # version tag on the images
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: The version is vX.Y.Z, on a commit of main
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::$GITHUB_REF_NAME is not a release version (vX.Y.Z)"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"; exit 1; }

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Fails when CI did not publish the images of this commit: nothing deployed.
      - name: Tag the images with the version
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          for image in $(grep -oE '/iadaf-[a-z-]+:' docker-compose.prod.yml | tr -d '/:' | sort -u); do
            docker buildx imagetools create \
              -t "ghcr.io/$OWNER/$image:$GITHUB_REF_NAME" "ghcr.io/$OWNER/$image:$GITHUB_SHA"
          done

      - name: Deploy over SSH
        id: deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/iadaf' }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::notice::prod is not configured yet (DEPLOY_HOST is empty): images tagged $GITHUB_REF_NAME, nothing deployed. See DEPLOYMENT.md § 8."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && git fetch --quiet --tags origin && git -c advice.detachedHead=false checkout --quiet $GITHUB_SHA && deploy/deploy.sh"
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Release notes
        if: github.event_name == 'push' && steps.deploy.outputs.deployed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
