# Every pull request and every push to dev_v1 (team integration), develop
# (staging) or main (production): lint, type-check, test, build, scan. Images
# are pushed to GHCR from develop and main only, tagged with the commit SHA;
# "latest" follows main.
#
# Third-party actions are pinned to the commit of a release (tag in comment):
# a moved or hijacked tag cannot change what runs here.
name: CI

on:
  pull_request:
  push:
    branches: [dev_v1, develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (types, lint, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src
      - name: Production build
        run: npm run build
        env:
          # Build-time placeholders only; real secrets are injected at runtime.
          AUTH_SECRET: ci-build-only
          INTERNAL_JWT_SECRET: ci-build-only-placeholder-32-bytes-minimum
      - name: Paid pack content stays out of the browser bundle
        run: |
          if grep -rl "Attestation de loyer" .next/static; then
            echo "::error::Paid content (packContent.ts) leaked into a client bundle"
            exit 1
          fi
      - name: No high or critical vulnerability in production dependencies
        run: npm audit --omit=dev --audit-level=high

  java:
    name: Java services (mvn verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn -B -ntp verify

  python:
    name: AI service (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test

  deploy:
    name: Deployment files (shellcheck, compose, Caddyfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned: the runner's own shellcheck changes with the image, and
      # flagged what the version used locally did not.
      - name: Shell scripts
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 \
            deploy/*.sh ai-service/docker-entrypoint.sh
      - name: Production compose resolves, with every required variable set
        run: |
          deploy/generate-secrets.sh "$RUNNER_TEMP/prod.env"
          sed -i -e 's/^DOMAIN=$/DOMAIN=ci.example/' -e 's/^ACME_EMAIL=$/ACME_EMAIL=ci@ci.example/' \
            -e 's/^GHCR_OWNER=$/GHCR_OWNER=ci/' -e 's/^IMAGE_TAG=$/IMAGE_TAG=ci/' \
            -e 's/^OPENAI_API_KEY=$/OPENAI_API_KEY=ci/' -e 's/^STRIPE_SECRET_KEY=$/STRIPE_SECRET_KEY=ci/' \
            -e 's/^STRIPE_WEBHOOK_SECRET=$/STRIPE_WEBHOOK_SECRET=ci/' -e 's/^SMTP_URL=$/SMTP_URL=smtp:\/\/ci/' \
            -e 's/^MAIL_FROM=$/MAIL_FROM=ci@ci.example/' "$RUNNER_TEMP/prod.env"
          cp "$RUNNER_TEMP/prod.env" .env
          docker compose config -q
          # The frontend must never be published once the overlay applies.
          if docker compose config --format json | jq -e '.services.frontend.ports // [] | length > 0'; then
            echo "::error::frontend publishes a port in production"; exit 1
          fi
      - name: Caddyfile, for production and for staging
        run: |
          validate() {  # validate <folder mounted as /etc/caddy/caddy.d>
            docker run --rm -e DOMAIN=ci.example -e ACME_EMAIL=ci@ci.example \
              -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" -v "$1:/etc/caddy/caddy.d:ro" \
              caddy:2.11.4-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          }
          validate "$PWD/deploy/caddy.d"
          # Staging restricted access, with a real hash in place of the placeholder.
          hash="$(docker run --rm caddy:2.11.4-alpine caddy hash-password --plaintext ci)"
          mkdir -p "$RUNNER_TEMP/staging"
          sed "s|\$2a\$14\$REMPLACER[^ ]*|$hash|" deploy/caddy.d/staging.caddy.example \
            > "$RUNNER_TEMP/staging/staging.caddy"
          validate "$RUNNER_TEMP/staging"

  images:
    name: Image ${{ matrix.name }}
    needs: [frontend, java, python, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: frontend, context: front, file: front/DockerFile }
          - { name: ai-service, context: ai-service, file: ai-service/Dockerfile }
          - { name: api-gateway, context: ., file: api-gateway/Dockerfile }
          - { name: discovery-service, context: ., file: discovery-service/Dockerfile }
          - { name: user-service, context: ., file: user-service/Dockerfile }
          - { name: demarches-service, context: ., file: demarches-service/Dockerfile }
          - { name: document-service, context: ., file: document-service/Dockerfile }
          - { name: analytics-service, context: ., file: analytics-service/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Image name (GHCR needs a lower-case owner)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/iadaf-${{ matrix.name }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
      - name: Scan — fail on any fixable critical vulnerability
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.74.0 image --quiet --exit-code 1 \
            --severity CRITICAL --ignore-unfixed "$IMAGE:${{ github.sha }}"
      - name: Report high vulnerabilities (not blocking)
        if: always()
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.74.0 image --quiet --exit-code 0 \
            --severity HIGH --ignore-unfixed "$IMAGE:${{ github.sha }}"
      - name: Log in to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi

  # Once every image of the commit is on GHCR: develop → staging, main → prod
  # (prod waits for the project owner's approval). See deploy.yml.
  ship:
    name: Deploy to ${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}
    needs: images
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}
    secrets: inherit
