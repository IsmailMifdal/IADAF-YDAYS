# A version tag vX.Y.Z on a commit of main (only admins may push v* tags):
# puts the version tag on the GHCR images of that commit and publishes the
# release notes. It deploys nothing: production gets main through CI and the
# Deploy workflow (#70, DEPLOYMENT.md § 8).
#
# Third-party actions are pinned to the commit of a release (tag in comment).
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # release notes
      packages: write   # version tag on the images
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: The version is vX.Y.Z, on a commit of main
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::$GITHUB_REF_NAME is not a release version (vX.Y.Z)"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"; exit 1; }

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Fails when CI did not publish the images of this commit.
      - name: Tag the images with the version
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          for image in $(grep -oE '/iadaf-[a-z-]+:' docker-compose.prod.yml | tr -d '/:' | sort -u); do
            docker buildx imagetools create \
              -t "ghcr.io/$OWNER/$image:$GITHUB_REF_NAME" "ghcr.io/$OWNER/$image:$GITHUB_SHA"
          done

      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
