version: '3.8'

# IA-DAF — Architecture simplifiée (3 services + Ollama)
#
#   discovery-service  :8761   (Spring Boot / Eureka)
#   api-gateway        :8080   (Spring Cloud Gateway)
#   ai-service         :8086   (Python / FastAPI)
#   ollama             :11434  (LLM local Mistral)

services:

  # --------------------------------------------------------------------------
  # Eureka Discovery Service
  # --------------------------------------------------------------------------
  discovery-service:
    build: ./discovery-service
    container_name: iadaf-discovery
    ports:
      - "8761:8761"
    networks:
      - iadaf-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # --------------------------------------------------------------------------
  # API Gateway
  # --------------------------------------------------------------------------
  api-gateway:
    build: ./api-gateway
    container_name: iadaf-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_SERVER_URL=http://discovery-service:8761/eureka
    networks:
      - iadaf-network
    depends_on:
      discovery-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # --------------------------------------------------------------------------
  # AI Service (Python / FastAPI)
  # --------------------------------------------------------------------------
  ai-service:
    build: ./ai-service
    container_name: iadaf-ai
    ports:
      - "8086:8086"
    environment:
      - EUREKA_SERVER_URL=http://discovery-service:8761/eureka
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=mistral
      - USE_OPENAI=false
      - CHROMA_PERSIST_DIR=/data/vectorstore
    volumes:
      - ai_vectorstore:/data/vectorstore
    networks:
      - iadaf-network
    depends_on:
      discovery-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/ai/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # --------------------------------------------------------------------------
  # Ollama — LLM local (Mistral 7B)
  # --------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: iadaf-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - iadaf-network
    restart: unless-stopped
    # Uncomment to use GPU (NVIDIA):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

networks:
  iadaf-network:
    driver: bridge

volumes:
  ai_vectorstore:
  ollama_data:
