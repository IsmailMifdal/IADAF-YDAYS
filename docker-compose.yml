# IA-DAF — Docker Compose
#
# Architecture :
#   postgres           :5432   (PostgreSQL 16)
#   discovery-service  :8761   (Spring Boot / Eureka)
#   api-gateway        :8080   (Spring Cloud Gateway)
#   ai-service         :8086   (Python / FastAPI + OpenAI)
#   frontend           :3000   (Next.js)
#
# Lancement :  docker compose up -d --build
# Arrêt :      docker compose down
# Logs :       docker compose logs -f <service>

services:
  # ====================================================================
  #  INFRASTRUCTURE
  # ====================================================================

  # --- PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    container_name: iadaf-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iadaf_db}
      POSTGRES_USER: ${POSTGRES_USER:-iadaf_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iadaf_password}
      TZ: Europe/Paris
    ports:
      - "5432:5432"
    volumes:
      # Defaults to the named volume below. Set POSTGRES_DATA_PATH to a host
      # path to bind-mount instead — a hardcoded Windows path would break any
      # Linux deployment.
      - ${POSTGRES_DATA_PATH:-postgres_data}:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - iadaf-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iadaf_user} -d ${POSTGRES_DB:-iadaf_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Eureka Discovery ---
  discovery-service:
    build:
      context: .
      dockerfile: discovery-service/Dockerfile
    container_name: iadaf-discovery
    ports:
      - "8761:8761"
    environment:
      - EUREKA_INSTANCE_HOSTNAME=discovery-service
    networks:
      - iadaf-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Eureka met jusqu'à ~85 s à démarrer sur une machine chargée (5 JVM qui
      # démarrent ensemble) : 40 s faisait échouer toute la stack, dont chaque
      # service attend ce healthcheck.
      start_period: 120s

  # ====================================================================
  #  GATEWAY
  # ====================================================================

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: iadaf-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICE-URL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - SPRING_CLOUD_GATEWAY_GLOBALCORS_CORS-CONFIGURATIONS_[/**]_ALLOWED-ORIGINS=http://localhost:3000
    networks:
      - iadaf-network
    depends_on:
      discovery-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Les JVM démarrent ensemble et se disputent le CPU : mesuré jusqu'à
      # ~370 s sur 8 vCPU. La fenêtre est large, mais le service passe
      # « healthy » dès le premier contrôle réussi : elle ne retarde rien.
      start_period: 300s

  # ====================================================================
  #  BACKEND SERVICES
  # ====================================================================

  # --- AI Service (Python / FastAPI) ---
  ai-service:
    build: ./ai-service
    container_name: iadaf-ai
    ports:
      - "8086:8086"
    environment:
      - EUREKA_SERVER_URL=http://discovery-service:8761/eureka
      - EUREKA_INSTANCE_HOSTNAME=ai-service
      - USE_OPENAI=true
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_TEMPERATURE=${OPENAI_TEMPERATURE:-0.1}
      - OPENAI_MAX_TOKENS=${OPENAI_MAX_TOKENS:-1000}
      - OPENAI_TIMEOUT_SECONDS=${OPENAI_TIMEOUT_SECONDS:-30}
      - CHROMA_PERSIST_DIR=/data/vectorstore
      - CORS_ORIGINS=${AUTH_URL:-http://localhost:3000}
      - DATABASE_URL=sqlite+aiosqlite:///./app/data/iadaf.db
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required — see .env.example}
      - CONVERSATION_RETENTION_DAYS=${CONVERSATION_RETENTION_DAYS:-30}
    volumes:
      - ai_vectorstore:/data/vectorstore
    networks:
      - iadaf-network
    depends_on:
      discovery-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/ai/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Le premier démarrage télécharge le modèle d'embeddings HuggingFace et
      # initialise ChromaDB : compter ~4 min. Une fenêtre plus courte fait
      # basculer le conteneur en "unhealthy" alors qu'il démarre normalement.
      start_period: 360s

  # --- User Service (Spring Boot / JPA) ---
  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: iadaf-user
    ports:
      - "8081:8081"
    environment:
      - EUREKA_CLIENT_SERVICE-URL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-iadaf_db}?currentSchema=users
      - POSTGRES_USER=${POSTGRES_USER:-iadaf_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-iadaf_password}
    networks:
      - iadaf-network
    depends_on:
      discovery-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Les JVM démarrent ensemble et se disputent le CPU : mesuré jusqu'à
      # ~370 s sur 8 vCPU. La fenêtre est large, mais le service passe
      # « healthy » dès le premier contrôle réussi : elle ne retarde rien.
      start_period: 300s

  # --- Demarches Service (Spring Boot / JPA) ---
  demarches-service:
    build:
      context: .
      dockerfile: demarches-service/Dockerfile
    container_name: iadaf-demarches
    ports:
      - "8082:8082"
    environment:
      - EUREKA_CLIENT_SERVICE-URL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-iadaf_db}?currentSchema=demarches
      - POSTGRES_USER=${POSTGRES_USER:-iadaf_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-iadaf_password}
    networks:
      - iadaf-network
    depends_on:
      discovery-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Les JVM démarrent ensemble et se disputent le CPU : mesuré jusqu'à
      # ~370 s sur 8 vCPU. La fenêtre est large, mais le service passe
      # « healthy » dès le premier contrôle réussi : elle ne retarde rien.
      start_period: 300s

  # --- Document Service (Spring Boot) ---
  # N'expose encore aucun endpoint métier : il s'enregistre dans Eureka et
  # répond sur /actuator/health, mais son domaine reste à implémenter.
  document-service:
    build:
      context: .
      dockerfile: document-service/Dockerfile
    container_name: iadaf-document
    ports:
      - "8083:8083"
    environment:
      - EUREKA_CLIENT_SERVICE-URL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-iadaf_db}?currentSchema=documents
      - POSTGRES_USER=${POSTGRES_USER:-iadaf_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-iadaf_password}
    networks:
      - iadaf-network
    depends_on:
      discovery-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Les JVM démarrent ensemble et se disputent le CPU : mesuré jusqu'à
      # ~370 s sur 8 vCPU. La fenêtre est large, mais le service passe
      # « healthy » dès le premier contrôle réussi : elle ne retarde rien.
      start_period: 300s

  # --- Analytics Service (Spring Boot) ---
  # Agrège les données des trois services ci-dessus via RestClient.
  analytics-service:
    build:
      context: .
      dockerfile: analytics-service/Dockerfile
    container_name: iadaf-analytics
    ports:
      - "8085:8085"
    environment:
      - EUREKA_CLIENT_SERVICE-URL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-iadaf_db}?currentSchema=analytics
      - POSTGRES_USER=${POSTGRES_USER:-iadaf_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-iadaf_password}
      - USER_SERVICE_URL=http://user-service:8081
      - DEMARCHES_SERVICE_URL=http://demarches-service:8082
      - DOCUMENT_SERVICE_URL=http://document-service:8083
    networks:
      - iadaf-network
    depends_on:
      discovery-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Les JVM démarrent ensemble et se disputent le CPU : mesuré jusqu'à
      # ~370 s sur 8 vCPU. La fenêtre est large, mais le service passe
      # « healthy » dès le premier contrôle réussi : elle ne retarde rien.
      start_period: 300s

  # ====================================================================
  #  FRONTEND
  # ====================================================================

  frontend:
    build:
      context: ./front
      dockerfile: DockerFile
    container_name: iadaf-front
    ports:
      - "3000:3000"
    environment:
      - API_GATEWAY_URL=http://api-gateway:8080
      # Auth.js reads users straight from Postgres (schema `users`).
      - DATABASE_URL=postgresql://${POSTGRES_USER:-iadaf_user}:${POSTGRES_PASSWORD:-iadaf_password}@postgres:5432/${POSTGRES_DB:-iadaf_db}
      - AUTH_SECRET=${AUTH_SECRET:?AUTH_SECRET is required — see .env.example}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required — see .env.example}
      - AUTH_URL=${AUTH_URL:-http://localhost:3000}
      - AUTH_TRUST_HOST=true
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID:-}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
    networks:
      - iadaf-network
    depends_on:
      api-gateway:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # node:20-alpine n'a pas curl, mais busybox fournit wget.
      # 127.0.0.1 et non localhost : ce dernier résout en ::1 dans le conteneur,
      # où le serveur Next n'écoute pas.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# ====================================================================
#  NETWORKS & VOLUMES
# ====================================================================

networks:
  iadaf-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  ai_vectorstore:
    driver: local
